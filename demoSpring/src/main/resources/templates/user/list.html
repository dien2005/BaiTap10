<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Danh sách User</title>
</head>
<body>
<main layout:fragment="content">
    <h3>Danh sách User</h3>

    <form method="get" th:action="@{/admin/users}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo username...">
        <button type="submit">Tìm</button>
    </form>
    <br>

    <a th:href="@{/admin/users/new}">Thêm User</a>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}">Sửa</a> |
                <a th:href="@{/admin/users/delete/{id}(id=${u.id})}">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
