<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Chat Hỗ Trợ Khách Hàng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #chat-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #messageArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px 10px 0 0;
            margin: 0;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.sent {
            background-color: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .message.received {
            background-color: #e9ecef;
            color: #333;
        }
        .message-header {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .input-group {
            padding: 20px;
            background-color: #fff;
            border-top: 1px solid #dee2e6;
        }
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .login-form {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div id="login-page">
        <div class="login-form">
            <h2 class="mb-4">Chat Hỗ Trợ Khách Hàng</h2>
            <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="Tên khách hàng hoặc support" />
            </div>
            <button class="btn btn-primary w-100" onclick="connect();">Kết nối</button>
        </div>
    </div>
    <div id="chat-page" style="display:none;">
        <div class="header">
            <h4>Phòng Chat Hỗ Trợ</h4>
            <small id="currentUser"></small>
        </div>
        <div id="messageArea" class="border"></div>
        <div class="input-group">
            <div class="input-group">
                <input type="text" class="form-control" id="message" placeholder="Nhập tin nhắn..." />
                <button class="btn btn-success" onclick="sendMessage();">Gửi</button>
            </div>
        </div>
    </div>
    <script>
        var stompClient = null;
        var username = null;

        function connect() {
            username = document.querySelector('#name').value.trim();
            if (username) {
                var socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);
                stompClient.connect({}, function (frame) {
                    stompClient.subscribe('/topic/public', onMessageReceived);
                    stompClient.send("/app/chat.addUser", {}, JSON.stringify({'sender': username, 'type': 'JOIN'}));
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('chat-page').style.display = 'flex';
                    document.getElementById('currentUser').textContent = 'Người dùng: ' + username;
                });
            }
        }

        function sendMessage() {
            var messageContent = document.querySelector('#message').value.trim();
            if (messageContent && stompClient) {
                var chatMessage = { sender: username, content: messageContent, type: 'CHAT' };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                document.querySelector('#message').value = '';
            }
        }

        function onMessageReceived(payload) {
            var message = JSON.parse(payload.body);
            var messageArea = document.querySelector('#messageArea');
            var messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            
            if (message.type === 'JOIN' || message.type === 'LEAVE') {
                messageDiv.innerHTML = '<div class="message-header">' + message.sender + '</div><div>' + (message.type === 'JOIN' ? 'đã tham gia' : 'đã rời khỏi') + '</div>';
                messageDiv.classList.add('received');
            } else {
                var isSent = message.sender === username;
                messageDiv.classList.add(isSent ? 'sent' : 'received');
                messageDiv.innerHTML = '<div class="message-header">' + message.sender + '</div><div>' + message.content + '</div>';
            }
            
            messageArea.appendChild(messageDiv);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        // Gửi tin nhắn khi nhấn Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('message').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
